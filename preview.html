<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/component.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/de3cc7cb54.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <nav class="nav__container">
        <a href="index.html">SONNET</a>
      </nav>
    </header>
    <main class="preview-page">
      <section class="preview-card card-base flex-col gap-md">
        <!-- Song Preview -->
        <!-- Spotify Embed -->
        <iframe
          data-testid="embed-iframe"
          style="border-radius: 12px"
          src="https://open.spotify.com/embed/track/2wsa9Re66HqlOkgb3DpnBX?utm_source=generator"
          width="100%"
          height="352"
          frameborder="0"
          allowfullscreen=""
          allow="
            autoplay;
            clipboard-write;
            encrypted-media;
            fullscreen;
            picture-in-picture;
          "
          loading="lazy"
        ></iframe>

        <!-- Message Content -->
        <article class="note">
          <header class="note-header">
            <p class="from">From <strong>Jerry</strong></p>
            <p class="to">To <strong>Sarah</strong></p>
          </header>

          <p class="message">
            I heard this song and it instantly made me think of you. It reminds
            me of our late-night talks and quiet laughs. I hope it brings a
            smile to your face.
          </p>
        </article>

        <!-- Actions -->
        <div class="actions flex-row gap-md">
          <a href="create.html">
            <button class="btn btn-secondary">
              <i class="fa-regular fa-pen-to-square"></i>Edit note
            </button>
          </a>
          <button class="btn btn-primary">
            <i class="fa-regular fa-copy"></i>Copy link
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
