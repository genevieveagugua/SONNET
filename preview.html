<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview</title>
  </head>
  <body>
    <main class="preview-page">
      <section class="preview-card">
        <!-- Song Preview -->
          <!-- Spotify Embed -->
          <iframe
            data-testid="embed-iframe"
            style="border-radius: 12px"
            src="https://open.spotify.com/embed/track/2wsa9Re66HqlOkgb3DpnBX?utm_source=generator"
            width="100%"
            height="352"
            frameborder="0"
            allowfullscreen=""
            allow="
              autoplay;
              clipboard-write;
              encrypted-media;
              fullscreen;
              picture-in-picture;
            "
            loading="lazy"
          ></iframe>

        <!-- Message Content -->
        <article class="note">
          <header class="note-header">
            <p class="from">From <strong>Jerry</strong></p>
            <p class="to">To <strong>Sarah</strong></p>
          </header>

          <p class="message">
            I heard this song and it instantly made me think of you. It reminds
            me of our late-night talks and quiet laughs. I hope it brings a
            smile to your face.
          </p>
        </article>

        <!-- Actions -->
        <div class="actions">
          <button class="btn btn-secondary">Edit note</button>
          <button class="btn btn-primary">Share link</button>
        </div>
      </section>
    </main>
  </body>
</html>
