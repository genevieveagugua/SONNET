<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/component.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/pages.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form>
      <h6>Create your account</h6>
      <p>Start sending songs and handwritten notes in minutes.</p>
      <label for="first-name">First name</label>
      <input type="text" id="first-name" name="first-name" placeholder="Ada" />

      <label for="last-name">Last name</label>
      <input type="text" id="last-name" name="last-name" placeholder="Lovelace" />

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="adalovelace@me.com"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="password"
      />

      <button type="submit">Create Account</button>
      <p>Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </body>
</html>
