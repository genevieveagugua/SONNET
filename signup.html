<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/component.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/pages.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="nav__container">
        <a href="index.html">SONNET</a>
      </nav>
    </header>
    <main>
      <section>
      <form class="form-centered card-base full-width max-width-sm flex-col gap-md">
        <h6 class="text-center">Create your account</h6>
        <p class="text-center text-medium">Start sending songs and handwritten notes in minutes.</p>
        
        <div class="field-row flex-row gap-md">
          <div class="field-group flex-col gap-sm">
            <label for="first-name" class="text-small">First name</label>
            <input
              type="text"
              id="first-name"
              name="first-name"
              placeholder="Ada"
            />
          </div>

          <div class="field-group flex-col gap-sm">
            <label for="last-name" class="text-small">Last name</label>
            <input
              type="text"
              id="last-name"
              name="last-name"
              placeholder="Lovelace"
            />
          </div>
        </div>

        <div class="field-group flex-col gap-sm">
          <label for="email" class="text-small">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="adalovelace@me.com"
          />
        </div>

        <div class="field-group flex-col gap-sm">
          <label for="password" class="text-small">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="password"
          />
        </div>

        <button type="submit">Create Account</button>
        <p class="text-center text-small">Already have an account? <a href="login.html">Log in</a></p>
      </form>
      </section>
    </main>
  </body>
</html>
