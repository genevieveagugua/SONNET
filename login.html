 <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/component.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <form>
      <h4>Welcome back</h4>
      <p>Continue your midnight melody journey.</p>
      
      <label for="email">Email address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="name@example.com"
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
      />

      <button type="submit">Log in</button>
      <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      <p>By clicking continue, you agree to our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</p>
    </form>
  </body>
</html>
