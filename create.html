<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Note</title>
    <title>Create Note</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/component.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="nav__container">
        <a href="index.html">SONNET</a>
      </nav>
    </header>
    <main>
    <section>
      <form id="sonnet-note" method="get" action="preview.html" class="form-centered card-base full-width max-width-sm flex-col gap-md">
        <h4 class="text-center">Compose your note</h4>
        <p class="text-center text-medium">Share a song that speaks for you, along with a personal message.</p>
        
        <div class="field-group flex-col gap-sm">
          <label for="song-link" class="text-small">Song link</label>
          <input
            type="url"
            id="song-link"
            name="song-link"
            required
            placeholder="Copy and paste a link from Spotify"
          />
        </div>

        <div class="field-row flex-row gap-md">
          <div class="field-group flex-col gap-sm">
            <label for="from-name" class="text-small">From</label>
            <input
              type="text"
              id="from-name"
              name="from-name"
              required
              placeholder="Your name"
            />
          </div>
          
          <div class="field-group flex-col gap-sm">
            <label for="to-name" class="text-small">To</label>
            <input
              type="text"
              id="to-name"
              name="to-name"
              required
              placeholder="Recipient's name"
            />
          </div>
        </div>

        <div class="field-group flex-col gap-sm">
          <label for="occasion" class="text-small">Occasion</label>
          <input
            type="text"
            id="occasion"
            name="occasion"
            placeholder="Birthday, Anniversary, Just because..."
          />
        </div>

        <div class="field-group flex-col gap-sm">
          <label for="vibe" class="text-small">Vibe</label>
          <input
            type="text"
            id="vibe"
            name="vibe"
            placeholder="Romantic, nostalgic, comforting, playful..."
          />
        </div>
        
        <div class="field-group flex-col gap-sm">
          <label for="your-note" class="text-small">Your note</label>
          <textarea
            id="your-note"
            name="your-note"
            rows="8"
            required
            placeholder="Write a heartfelt message here..."
          ></textarea>
        </div>

        <section class="ai-generator">
          <h5>Need help finding the right words?</h5>
          <p>
            Tell us the occasion and the vibe you're going for, and let AI help you write a heartfelt note.
          </p>
          <button
            type="button"
            id="generate-note"
            class="btn-secondary"
          >
            Generate with AI
          </button>
          <p id="ai-status" class="text-small"></p>
        </section>
        
        <button type="submit" class="btn-primary">Preview Note</button>
      </form>
    </section>
    </main>
  </body>
</html>
